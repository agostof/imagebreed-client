#--cov=analytics_modules
[pytest]
addopts = --import-mode=importlib --strict-markers --cov=imagebreed  --cov-report=term-missing --cov-fail-under=30 --ignore=analytics_modules --ignore=imagebreedml
markers =
    unit: fast isolated tests (default marker for tests outside integration/regression folders)
    integration: cross-module and I/O boundary tests
    smoke: lightweight high-signal workflow checks intended for required CI jobs
    slow: long-running tests reserved for scheduled/manual CI runs
    legacy_geojson: legacy/non-PixelGeoJSON compatibility behavior checks
    regression: regression-focused tests for previously fixed behavior
    cli: command-line entrypoint and argument parsing checks
    #norecursedirs = analytics_modules 
#[pytest]
#testpaths = tests